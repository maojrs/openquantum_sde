[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openquantum_sde"
version = "0.1.0"
description = "Numerical integrators for stochastic Schrödinger equations in open quantum systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pytest>=9.2.0",
]
notebooks = [
    "jupyter>=1.1.1",
]
